[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/upendrx/candlerail"
homepage = "https://github.com/upendrx/candlerail"
keywords = ["trading", "backtesting", "indicators", "paper-trading", "strategy"]
categories = ["finance"]

[workspace.dependencies]
candlerail-core = { path = "crates/core" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
