name: New indicator or template
description: Request (or offer) an indicator or strategy template
labels: ["indicator"]
body:
  - type: input
    id: name
    attributes:
      label: Indicator or strategy
      placeholder: "Ichimoku cloud, Parabolic SAR, RSI divergence ..."
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Definition
      description: The formula or rules, and a link to a reference (book, paper, TradingView docs).
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to implement this (see CONTRIBUTING.md)
