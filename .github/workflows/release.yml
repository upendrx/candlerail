name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="candlerail-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "${name:?}"
          cp -r templates README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "${name:?}/"
          bin=target/${{ matrix.target }}/release/candlerail
          if [ -f "$bin.exe" ]; then cp "$bin.exe" "${name:?}/"; else cp "$bin" "${name:?}/"; fi
          tar czf "${name:?}.tar.gz" "${name:?}"
      - uses: softprops/action-gh-release@v2
        with:
          files: candlerail-*.tar.gz
