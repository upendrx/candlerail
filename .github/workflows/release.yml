name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          # Asset names carry no version, so /releases/latest/download/<name> always
          # points at the newest build. The install scripts rely on this.
          name="candlerail-${{ matrix.target }}"
          mkdir -p "${name:?}"
          cp -r templates README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "${name:?}/"
          bin=target/${{ matrix.target }}/release/candlerail
          if [ -f "$bin.exe" ]; then
            cp "$bin.exe" "${name:?}/"
            7z a -tzip "${name:?}.zip" "${name:?}" > /dev/null
          else
            cp "$bin" "${name:?}/"
            tar czf "${name:?}.tar.gz" "${name:?}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            candlerail-*.tar.gz
            candlerail-*.zip
